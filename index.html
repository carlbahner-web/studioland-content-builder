<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Unlisted, not private. This is hosted (GitHub Pages) and nothing links
         here; this asks crawlers to keep it out of results, which is the
         difference between "unlisted" and "merely not linked yet". Pages serves
         no custom headers, so the JS and the brand images - separately fetchable
         URLs that this tag does not reach - rely on public/robots.txt. -->
    <meta name="robots" content="noindex, nofollow" />
    <title>StudioLand content builder</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
