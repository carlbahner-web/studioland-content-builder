# Not the live host. The live one is GitHub Pages, from
# .github/workflows/pages.yml. This file stays because Pages CANNOT be password
# protected - not on a public repo, not at any tier - and Netlify can, so this is
# the escape hatch: the day the tool needs a gate in front of it, connecting this
# repo to Netlify and turning on password protection is the five-minute job, and
# the Pages workflow comes out.
#
# THIS TOOL HAS NO SIGN-IN. The bundle holds no customer data, no key and no
# write path, so the worst a finder could do is make a StudioLand-looking
# graphic. If that stops being true - a real client name in a draft, someone
# else's work in the same storage - the options are Netlify password protection
# here, Clerk (the CRM's approach; there is a working version in the prototype
# history), or a Cloudflare Access rule.
[build]
  command = "npm run build"
  publish = "dist"

# Keep it out of search results. The meta tag in index.html covers the page;
# this header also covers the JS and the brand images, which are separately
# fetchable URLs and would otherwise be indexable on their own.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
